name: Laravel development checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP tests and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, bcmath, fileinfo
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Laravel tests
        run: php artisan test
      - name: Check PHP formatting
        run: vendor/bin/pint --test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, intl, gd
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - name: Create disposable browser database
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8010#' .env
          echo "DB_DATABASE=$PWD/database/browser.sqlite" >> .env
          touch database/browser.sqlite
          php artisan migrate --force
          APP_ENV=testing php artisan db:seed --class=BrowserTestSeeder --force
      - run: npx playwright install --with-deps chromium
      - name: Start local application server
        run: |
          php artisan serve --host=127.0.0.1 --port=8010 > /tmp/laravel-browser.log 2>&1 &
          sleep 3
      - run: npm run test:browser
      - name: Print server errors on failure
        if: failure()
        run: cat /tmp/laravel-browser.log || true
