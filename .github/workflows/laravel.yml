name: Laravel development checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP tests and style
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, bcmath, fileinfo
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Laravel tests
        run: php artisan test
      - name: Format PHP files (one-time repair)
        run: vendor/bin/pint
      - name: Commit PHP formatting (one-time repair)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Laravel Pint formatting'
            git push origin HEAD:master
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build