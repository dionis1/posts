name: Resolve Livewire dependencies (temporary)

on:
  push:
    paths:
      - .github/workflows/livewire-lock.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, bcmath, fileinfo
          coverage: none
          tools: composer:v2
      - name: Install stable Livewire 4 and update lock
        run: composer require 'livewire/livewire:^4.0' --no-interaction --no-progress --prefer-dist
      - name: Commit resolved dependencies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          git commit -m 'build: install Livewire 4 with reproducible Composer lockfile'
          git push origin HEAD:master
